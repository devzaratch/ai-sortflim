<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">MOVIES AI</title>
  <desc id="logoDesc">แถบฟิล์มแนวตั้งมีปุ่มเล่นและประกาย AI สีอำพัน</desc>
  <defs>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="0.55" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- จอแนวตั้ง (9:16) ในรูปแถบฟิล์ม -->
  <rect x="18" y="8" width="28" height="48" rx="7" fill="url(#amberGrad)"/>
  <!-- รูเฟิล์มฟิล์ม -->
  <g fill="#1c1917" opacity="0.92">
    <rect x="21.5" y="12.5" width="4" height="3.5" rx="1.6"/>
    <rect x="38.5" y="12.5" width="4" height="3.5" rx="1.6"/>
    <rect x="21.5" y="48" width="4" height="3.5" rx="1.6"/>
    <rect x="38.5" y="48" width="4" height="3.5" rx="1.6"/>
  </g>
  <!-- ปุ่มเล่น -->
  <path d="M27.5 24.5 L41.5 32 L27.5 39.5 Z" fill="#1c1917" stroke="#1c1917" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- ประกาย AI -->
  <path d="M52 3.5 L53.5 6.5 L56.5 8 L53.5 9.5 L52 12.5 L50.5 9.5 L47.5 8 L50.5 6.5 Z" fill="#FDE68A"/>
</svg>
