name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ต้อง 0 error)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # E2E ต่อข้อมูลจริงใน Supabase → ต้องมี secrets คู่นี้ใน repo settings
      # (ถ้าไม่มีจะข้ามเทสต์ แต่ lint/typecheck ยังกันพื้นฐานไว้)
      - name: Check Supabase secrets
        id: secrets
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ไม่มี secrets NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY — ข้าม E2E (เพิ่มใน Settings → Secrets and variables → Actions)"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Install Playwright browsers
        if: steps.secrets.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: E2E (public pages + mobile)
        if: steps.secrets.outputs.available == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run test:e2e
