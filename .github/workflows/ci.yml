name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ต้อง 0 error)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # E2E ต่อข้อมูลจริงใน Supabase → ต้องมี secrets คู่นี้ใน repo settings
      # (ถ้าไม่มีจะข้ามเทสต์ แต่ lint/typecheck ยังกันพื้นฐานไว้)
      - name: Check Supabase secrets
        id: secrets
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ไม่มี secrets NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY — ข้าม E2E (เพิ่มใน Settings → Secrets and variables → Actions)"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Install Playwright browsers
        if: steps.secrets.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: E2E (public pages + mobile)
        if: steps.secrets.outputs.available == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run test:e2e

  # Smoke test production หลัง push — รอจน Vercel deploy เสร็จแล้วเช็ค /api/health
  production-smoke:
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Wait for deploy + check /api/health
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 15 "https://ai-sortflim.vercel.app/api/health" || true)
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              echo "production healthy:"; cat /tmp/health.json
              exit 0
            fi
            echo "attempt $i: HTTP $code — deploy ยังไม่เสร็จหรือ unhealthy รอ 15 วิ..."
            sleep 15
          done
          echo "::error::production /api/health ไม่ตอบ ok ภายใน 10 นาที"; cat /tmp/health.json || true
          exit 1
